name: Design
description: Задача по дизайну
title: '[Design] '
type: 'Design'
assignees:
  - TorinAsakura
body:
  - type: dropdown
    id: design-type
    attributes:
      label: Тип дизайн-задачи
      options:
        - UI
        - UX
        - Design System
        - Research
      default: 0
    validations:
      required: true

  - type: input
    id: motivation
    attributes:
      label: Зачем это делаем?
      placeholder: Какая цель, проблема или ограничение заставляет делать эту задачу
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Что именно меняем?
      placeholder: Экраны, сценарии, компоненты, состояния или артефакты
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Артефакты
      placeholder: Ссылки на Figma, прототипы, референсы или материалы

  - type: textarea
    id: dod
    attributes:
      label: Критерии готовности
      placeholder: Что считаем сделанным
    validations:
      required: true
